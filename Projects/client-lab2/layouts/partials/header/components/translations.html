{{ if .IsTranslated }}
  <div class="translation nested-menu">
    <button class="cursor-pointer flex items-center" type="button" aria-label="Language">
      <span class="me-1">
        {{ partial "icon.html" "language" }}
      </span>
      <span class="text-sm font-medium bf-icon-color-hover" title="{{ .Site.Language.LanguageName }}">
        {{- .Site.Language.Params.displayName | default .Site.Language.LanguageName | markdownify -}}
      </span>
    </button>
    <ul class="menuhide">
      <li class="rounded-xl backdrop-blur shadow-2xl p-2 flex flex-col gap-1">
        {{ range .AllTranslations }}
          <a href="{{ .RelPermalink }}" class="flex items-center bf-icon-color-hover px-3 py-1">
            <span class="text-sm font-sm" title="{{ .Language.LanguageName }}">
              {{ .Language.Params.displayName | default .Language.LanguageName | emojify }}
            </span>
          </a>
        {{ end }}
      </li>
    </ul>
  </div>
{{ end }}
